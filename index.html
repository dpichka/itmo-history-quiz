<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>От РУЦН до ИТМО</title>
<meta name="description" content="Квиз из 5 вопросов по видеолекции «История Университета ИТМО»">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fb; --card:#ffffff; --ink:#141a33; --muted:#5b6382; --line:#dde2f0;
  --accent:#1f46d6; --accent-soft:#e7ecff;
  --ok:#17804a; --ok-bg:#e6f6ec; --bad:#c03b3b; --bad-bg:#fdecec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1222; --card:#171c31; --ink:#eef1ff; --muted:#a3abc9; --line:#2a3150;
    --accent:#7d97ff; --accent-soft:#232c55;
    --ok:#5fd393; --ok-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1a1d;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1222; --card:#171c31; --ink:#eef1ff; --muted:#a3abc9; --line:#2a3150;
  --accent:#7d97ff; --accent-soft:#232c55;
  --ok:#5fd393; --ok-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1a1d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 56px}
header{margin-bottom:24px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:8px 0 10px;font-weight:800}
.sub{color:var(--muted);margin:0}
.sub a{color:var(--accent)}
.steps{display:flex;gap:6px;margin:24px 0 16px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.steps span.done-ok{background:var(--ok)}
.steps span.done-bad{background:var(--bad)}
.steps span.now{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(20,26,51,.06)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;font-weight:700}
h2{font-size:clamp(19px,4vw,23px);line-height:1.3;margin:0 0 18px}
figure{margin:0 0 18px}
figure img{width:100%;display:block;border-radius:12px;border:1px solid var(--line)}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:12px;
  border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .num{background:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .num{background:var(--bad);color:var(--card)}
.note{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--accent-soft);display:none}
.note.show{display:block}
.note b{display:block;margin-bottom:4px}
.note p{margin:0}
.actions{display:flex;justify-content:flex-end;margin-top:18px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#fff;cursor:pointer}
.btn[hidden]{display:none}
.final{text-align:center;padding:16px 0}
.score{font-size:56px;font-weight:800;color:var(--accent);line-height:1;margin:8px 0}
.review{text-align:left;margin:24px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.review li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.review .r{font-weight:700}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:480px){.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">История России · Раздел 4</div>
    <h1>От ремесленного училища до ИТМО</h1>
    <p class="sub">5 вопросов по <a href="https://vkvideo.ru/video-173643328_456239092?list=ln-ZSmsE6z0VYZZ9lBeEO" target="_blank" rel="noopener">видеолекции «История Университета ИТМО»</a>: три — об учёных, два — по иллюстрациям из презентации.</p>
  </header>

  <div class="steps" id="steps"></div>
  <main class="card" id="card" aria-live="polite"></main>

  <footer>Квиз подготовлен по материалам видеолекции и слайдов презентации.</footer>
</div>

<script>
const Q = [
  {
    tag: "Учёные ИТМО",
    q: "Кто был организатором и мастером механико-оптического и часового отделения Ремесленного училища цесаревича Николая?",
    opts: ["Шиканов", "Завадский", "Титов", "Зилитинкевич"],
    a: 1,
    why: "Завадский (1862–1943) был организатором и мастером механико-оптического и часового отделения Ремесленного училища цесаревича Николая. На слайде «Первые преподаватели и первые результаты работы» рядом с его портретом показаны часы, сделанные учеником отделения. Имя мастера — Алексей — «собрано» на них из деталей часового механизма."
  },
  {
    tag: "Учёные ИТМО",
    q: "Какой профессор ЛИТМО вместе с аспирантом Г. Н. Моториным разрабатывал теорию расчёта оптических систем с несферическими поверхностями?",
    opts: ["Л. Г. Титов", "Ф. Галкин", "В. Н. Чуриловский", "С. И. Вавилов"],
    a: 2,
    why: "Теорию расчёта оптических систем с несферическими поверхностями разрабатывали профессор В. Н. Чуриловский и его аспирант Г. Н. Моторин. Чуриловский руководил также работами по астрономической оптике и скоростной киносъёмочной аппаратуре. Технологию изготовления таких поверхностей разрабатывал другой профессор, Л. Г. Титов, вместе с аспирантом С. Ф. Легуном."
  },
  {
    tag: "Учёные ИТМО",
    q: "Под руководством какого профессора в мае 1945 года подготовили проект нового, радиотехнического факультета ЛИТМО?",
    opts: ["С. И. Зилитинкевича", "С. А. Шиканова", "В. Н. Чуриловского", "Ю. Н. Денисюка"],
    a: 0,
    why: "В мае 1945 года под руководством профессора С. И. Зилитинкевича подготовили проект радиотехнического факультета и представили его директору института С. А. Шиканову. Проект предполагал преобразовать кафедру общей и специальной электротехники в пять специализированных кафедр. На том же слайде показана выпускная фотография электромехаников ЛИТМО 1943–1949 годов."
  },
  {
    tag: "По иллюстрации",
    q: "На старой открытке — здание училища на 1-й Роте Измайловского полка, с которого начинается история ИТМО. В каком году его основали?",
    img: "img-school.jpg",
    alt: "Старинная открытка: улица Петербурга и здание Ремесленного училища",
    cap: "Открытка «С.-Петербург. Первая Рота. Ремесленное училище» — слайд из лекции",
    opts: ["1862", "1875", "1900", "1917"],
    a: 1,
    why: "Ремесленное училище цесаревича Николая основали в 1875 году на 1-й Роте Измайловского полка (ныне 1-я Красноармейская улица), чтобы готовить мастеров-слесарей. На том же слайде помещён портрет цесаревича Николая Александровича (1843–1865). Первым заведующим механико-часовым отделением училища стал его директор В. М. Арбузов."
  },
  {
    tag: "По иллюстрации",
    q: "Эта спутниковая тарелка стоит на крыше здания ИТМО на Кронверкском проспекте. В каком году институт стал инициатором и основным разработчиком сети, название которой на ней написано?",
    img: "img-dish.jpg",
    alt: "Спутниковая тарелка с надписью RUNNet на крыше, на фоне петербургских крыш",
    cap: "Кадр из лекции · 1:16:55",
    opts: ["1992", "1994", "2009", "2011"],
    a: 1,
    why: "В 1994 году институт выступил инициатором и основным разработчиком RUNNet; на фото — спутниковая тарелка RUNNet Университета ИТМО на Кронверкском проспекте. В том же году институт получил статус университета и открыл факультет компьютерных технологий и управления. Двумя годами раньше, в 1992 году, ЛИТМО переименовали в Санкт-Петербургский институт точной механики и оптики."
  }
];

const card = document.getElementById("card");
const steps = document.getElementById("steps");
let i = 0, score = 0;
const res = [];

steps.innerHTML = Q.map(() => "<span></span>").join("");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function paintSteps(){
  [...steps.children].forEach((s, k) => {
    s.className = k < res.length ? (res[k] ? "done-ok" : "done-bad") : (k === i ? "now" : "");
  });
}

function show(){
  const x = Q[i];
  paintSteps();
  card.innerHTML = `
    <div class="meta"><span class="tag">${x.tag}</span><span>Вопрос ${i + 1} из ${Q.length}</span></div>
    <h2 tabindex="-1">${esc(x.q)}</h2>
    ${x.img ? `<figure><img src="${x.img}" alt="${esc(x.alt)}"><figcaption>${esc(x.cap)}</figcaption></figure>` : ""}
    <div class="opts">${x.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="num">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="note" id="note"><b id="verdict"></b><p>${esc(x.why)}</p></div>
    <div class="actions"><button class="btn" id="next" hidden>${i === Q.length - 1 ? "Посмотреть результат" : "Следующий вопрос"}</button></div>`;
  card.querySelector("h2").focus({preventScroll: true});
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(+b.dataset.k)));
  document.getElementById("next").addEventListener("click", () => { i++; i < Q.length ? show() : finish(); window.scrollTo({top: 0, behavior: "smooth"}); });
}

function pick(k){
  const x = Q[i], right = k === x.a;
  if (right) score++;
  res.push(right);
  card.querySelectorAll(".opt").forEach((b, n) => {
    b.disabled = true;
    if (n === x.a) b.classList.add("ok"); else if (n === k) b.classList.add("bad");
  });
  document.getElementById("verdict").textContent = right ? "Верно!" : `Неверно. Правильный ответ: ${x.opts[x.a]}.`;
  document.getElementById("note").classList.add("show");
  const nx = document.getElementById("next"); nx.hidden = false; nx.focus({preventScroll: true});
  paintSteps();
}

function finish(){
  i = Q.length; paintSteps();
  const word = score === 5 ? "Отлично!" : score >= 3 ? "Хороший результат" : "Стоит пересмотреть лекцию";
  card.innerHTML = `<div class="final">
    <div class="kicker">${word}</div>
    <div class="score">${score} / ${Q.length}</div>
    <p class="sub">правильных ответов</p>
    <ul class="review">${Q.map((x, k) => `<li><span class="r" style="color:var(${res[k] ? "--ok" : "--bad"})">${res[k] ? "✓" : "✗"}</span> ${esc(x.q)}<br><b>Ответ:</b> ${esc(x.opts[x.a])}</li>`).join("")}</ul>
    <div class="actions" style="justify-content:center"><button class="btn" id="again">Пройти ещё раз</button></div>
  </div>`;
  document.getElementById("again").addEventListener("click", () => { i = 0; score = 0; res.length = 0; show(); });
}

show();
</script>
</body>
</html>
